# dsh-zhengl-tj bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-zhengl-tj@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-zhengl-tj` to the
# bundle stack. The profile boot then merges THIS patch (a single `insert` of
# the plugin row) exactly like the manual cordis.patch.yml mount line used
# before. No profile file edits needed — one command installs and mounts.
#
# If the profile still carries the old manual mount line in its own
# cordis.patch.yml, remove it before switching to the bundle channel to
# avoid double-mounting (two host halves, two duplicate route registrations).
#
# Aggregate double-mount guard: aggregate bundles (e.g. dsh-web-ui-all) may
# already mount this package under their own entry id. Two mounts register
# /usage/api twice and fail the whole plugin tree at boot ("duplicate prefix
# route"). The `!!js` disabled expression backs THIS row off when another
# *enabled* entry already mounts `dsh-zhengl-tj`; the aggregate
# instance then owns the panel.
- insert:
    - id: usage-stats
      name: 'dsh-zhengl-tj'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-zhengl-tj' && e.options.id !== 'usage-stats' && !e.disabled)"
